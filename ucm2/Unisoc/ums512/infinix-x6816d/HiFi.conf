SectionDevice."Mic" {
	Comment "Microphone capture"

	ConflictingDevice [
		"Headset"
		"Mic2"
	]

	EnableSequence [
		cset "name='ADCL Mixer MIC' on"
		cset "name='Main Mic Switch' on"
		cset "name='Capture Volume' 6"
	]

	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='ADCL Mixer MIC' off"
		cset "name='Capture Volume' 0"
	]

	Value {
		CapturePriority 200
	}

	Macro.pcm_split.SplitPCMDevice {
		Name "ums512_mono_in"
		Device 1
		Direction Capture
		HWChannels 2
		Channels 1
		Channel0 0
		ChannelPos0 MONO
	}
}

