# SPDX-License-Identifier: BSD-3-Clause

Syntax 7

Comment "Infinix HOT 12 Play (X6816D)"

# Kernel FE PCM numbering: fast playback 0, DSP capture 1, voice capture 3.
# SC2730 routes follow vendor/etc/audio_route.xml from the Android dump.
# AK4377 and Android-only DSP effects are not part of this sound card.

Include.pcm_split.File "/common/pcm/split.conf"

Macro [
	{
		SplitPCM {
			Name "ums512_mono_in"
			Direction Capture
			Channels 1
			HWChannels 2
			HWChannelPos0 MONO
			HWChannelPos1 MONO
		}
	}
]

SectionUseCase."HiFi" {
	File "/Unisoc/ums512/infinix-x6816d/HiFi.conf"
	Comment "Default"
}

SectionUseCase."Voice Call" {
	File "/Unisoc/ums512/infinix-x6816d/VoiceCall.conf"
	Comment "Voice call"
}

# Pins default to off: the kernel does not implement jack detection yet.
SectionDefaults [
	cset "name='Speaker Switch' off"
	cset "name='Headphones Switch' off"
	cset "name='Earpiece Switch' off"
	cset "name='Main Mic Switch' off"
	cset "name='Aux Mic Switch' off"
	cset "name='Headset Mic Switch' off"
	cset "name='Headphone Playback Switch' off"
	cset "name='Earpiece Playback Switch' off"
	cset "name='Headphone Volume' 0"
	cset "name='Earpiece Volume' 0"
	cset "name='Capture Volume' 0"
	cset "name='ADCL Mixer MIC' off"
	cset "name='ADCL Mixer HPMIC' off"
	cset "name='ADCR Mixer MIC2' off"
	cset "name='ADCR Mixer HPMIC' off"
	cset "name='FE_FAST_PLAYBACK TX Switch' off"
	cset "name='FE_CAPTURE_DSP RX Switch' off"
	cset "name='FE_VOICE TX Switch' off"
	cset "name='FE_VOICE RX Switch' off"
	cset "name='Voice Record Downlink' off"
	cset "name='Voice Record Uplink' off"
]
