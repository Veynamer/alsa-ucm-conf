SectionDevice."Mic" {
	Comment "Microphone capture"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='ADCL Mixer MIC' on"
		cset "name='Main Mic Switch' on"
		cset "name='Capture Volume' 7"
	]

	DisableSequence [
		cset "name='Main Mic Switch' off"
		cset "name='ADCL Mixer MIC' off"
		cset "name='Capture Volume' 0"
	]

	Value {
		CapturePriority 200
		CaptureChannels 1
		CapturePCM "hw:${CardId},3"
	}
}

SectionDevice."Headset" {
	Comment "Headset capture"

