SectionVerb {
	EnableSequence [
		cset "name='TX0 SEL' IIS0"
		cset "name='RX0 SEL' IIS1"

		cset "name='FE_FAST_PLAYBACK TX Switch' on"
		cset "name='FE_CAPTURE_DSP RX Switch' on"
	]

	If.CaptureDigitalVolume {
		Condition {
			Type ControlExists
			Control "name='RX0 Digital Capture Volume'"
		}
		True {
			EnableSequence [
				cset "name='RX0 Digital Capture Volume' 127"
			]
		}
	}

	DisableSequence [
		cset "name='FE_CAPTURE_DSP RX Switch' off"
		cset "name='FE_FAST_PLAYBACK TX Switch' off"
	]

	Value {
		PlaybackRate 48000
		CaptureRate 48000
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='TX0 MIXER0 Mode' NOT_MIX"
		cset "name='Headphone Playback Switch' on"
		cset "name='Headphone Volume' 6"
		cset "name='Headphones Switch' on"
	]

	DisableSequence [
		cset "name='Headphones Switch' off"
		cset "name='Headphone Volume' 0"
		cset "name='Headphone Playback Switch' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackMixerElem "Headphone"
		PlaybackChannels 2
		PlaybackPCM "hw:${CardId},0"
	}
}

